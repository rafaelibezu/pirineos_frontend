<ion-content [fullscreen]="true">

  <div class="login-page">

    <section class="login-panel">

      <div class="brand">

        <img
          src="assets/icon/pirineos_logo.png"
          alt="Bar Los Pirineos"
          class="logo-mark"
        />

        <div class="brand-text">

          <span class="brand-title">
            BAR
          </span>

          <span class="brand-subtitle">
            LOS PIRINEOS
          </span>

        </div>

      </div>

      <div class="welcome">

        <h1>
          Bienvenido
        </h1>

      </div>

      <form
        [formGroup]="loginForm"
        (ngSubmit)="login()"
      >

        <div class="field-group">

          <label for="username">
            Usuario
          </label>

          <div
            class="input-wrapper"
            [class.input-error]="usernameInvalid"
          >

            <ion-icon
              name="person-outline"
              class="field-icon"
            ></ion-icon>

            <input
              id="username"
              type="text"
              formControlName="username"
              placeholder="Ingresa tu usuario"
              autocomplete="username"
            />

          </div>

          <span
            class="error-text"
            *ngIf="usernameInvalid"
          >
            Ingresa tu usuario
          </span>

        </div>

        <div class="field-group">

          <label for="password">
            Contraseña
          </label>

          <div
            class="input-wrapper"
            [class.input-error]="passwordInvalid"
          >

            <ion-icon
              name="lock-closed-outline"
              class="field-icon"
            ></ion-icon>

            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
            />

            <button
              type="button"
              class="password-button"
              (click)="togglePassword()"
              [attr.aria-label]="
                showPassword
                  ? 'Ocultar contraseña'
                  : 'Mostrar contraseña'
              "
            >

              <ion-icon
                [name]="
                  showPassword
                    ? 'eye-off-outline'
                    : 'eye-outline'
                "
              ></ion-icon>

            </button>

          </div>

          <span
            class="error-text"
            *ngIf="passwordInvalid"
          >
            Ingresa tu contraseña
          </span>

        </div>

        <div class="login-options">

          <label class="remember-option">

            <ion-checkbox
              formControlName="rememberMe"
            ></ion-checkbox>

            <span>
              Recordarme
            </span>

          </label>

        </div>

        <div
          class="server-error"
          *ngIf="errorMessage"
        >
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          class="login-button"
          [disabled]="loading"
        >

          <ng-container *ngIf="!loading">
            INICIAR SESIÓN
          </ng-container>

          <ion-spinner
            *ngIf="loading"
            name="crescent"
          ></ion-spinner>

        </button>

        <button
          type="button"
          class="forgot-button"
        >
          ¿Olvidaste tu contraseña?
        </button>

      </form>

    </section>

    <div class="version">
      Versión 1.0.0
    </div>

  </div>

</ion-content>
