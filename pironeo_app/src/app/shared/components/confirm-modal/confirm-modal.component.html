<ion-modal [isOpen]="isOpen()" (didDismiss)="cancelled.emit()">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>{{ title() }}</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <p>{{ message() }}</p>
      <ion-buttons class="actions">
        <ion-button fill="clear" (click)="cancelled.emit()">Cancelar</ion-button>
        <ion-button color="danger" fill="solid" (click)="confirmed.emit()">Confirmar</ion-button>
      </ion-buttons>
    </ion-content>
  </ng-template>
</ion-modal>
